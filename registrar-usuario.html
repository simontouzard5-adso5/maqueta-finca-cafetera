    <h1>Nuevo usuario<small>Usuarios</small></h1>
    
  </header>
  <main id="contenido" class="contenido">
    <form class="formulario" data-validar novalidate>
      <fieldset><legend>1. Identidad</legend>
    <div class="campo">
      <label class="form-label" for="nombres">Nombres <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="nombres" autocomplete="given-name" required data-mensaje="Escriba los nombres." aria-describedby="nombres-error">
      <div class="mensaje-error" id="nombres-error" aria-live="polite"></div>
    </div>
    <div class="campo">
      <label class="form-label" for="apellidos">Apellidos <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="apellidos" autocomplete="family-name" required data-mensaje="Escriba los apellidos." aria-describedby="apellidos-error">
      <div class="mensaje-error" id="apellidos-error" aria-live="polite"></div>
    </div>
      </fieldset>
      <fieldset><legend>2. Documento</legend>
    <div class="campo">
      <label class="form-label" for="cedula">Número de cédula <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="cedula" inputmode="numeric" required data-mensaje="Escriba la cédula, entre 6 y 10 dígitos." aria-describedby="cedula-ayuda cedula-error">
      <div class="form-text" id="cedula-ayuda">Sin puntos, entre 6 y 10 dígitos.</div>
      <div class="mensaje-error" id="cedula-error" aria-live="polite"></div>
    </div>
    <div class="campo">
      <label class="form-label" for="nacimiento">Fecha de nacimiento <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="nacimiento" type="date" required data-mensaje="Escriba la fecha de nacimiento." aria-describedby="nacimiento-error">
      <div class="mensaje-error" id="nacimiento-error" aria-live="polite"></div>
    </div>
      </fieldset>
      <fieldset><legend>3. Acceso</legend>
    <div class="campo">
      <label class="form-label" for="correo-u">Correo electrónico <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="correo-u" type="email" required data-mensaje="Escriba el correo del usuario." aria-describedby="correo-u-error">
      <div class="mensaje-error" id="correo-u-error" aria-live="polite"></div>
    </div>
    <div class="campo">
      <label class="form-label" for="rol">Rol <span class="obligatorio" aria-hidden="true">*</span></label>
      <select class="form-select" id="rol" required data-mensaje="Elija el rol." aria-describedby="rol-ayuda rol-error"><option value="">Seleccione</option><option>Administrador de finca</option><option>Dueño de finca</option></select>
      <div class="form-text" id="rol-ayuda">El rol define las secciones que verá en la aplicación.</div>
      <div class="mensaje-error" id="rol-error" aria-live="polite"></div>
    </div>
        <div class="form-check"><input class="form-check-input" type="checkbox" id="autoriza"><label class="form-check-label" for="autoriza" style="font-size:var(--fs-etiqueta)">El usuario autoriza el tratamiento de sus datos personales</label></div>
      </fieldset>
      <button class="btn-primario" type="submit">Guardar usuario</button>
      <a class="btn-secundario" href="usuarios.html">Cancelar</a>
    </form>
  </main>
