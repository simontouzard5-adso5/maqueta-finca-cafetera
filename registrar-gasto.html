    <form class="formulario" data-validar novalidate>
      <fieldset>

      </fieldset>
      <div id="detalle-insumo" class="detalle-insumo">
        <fieldset>
          <legend>Clase de insumo <span class="obligatorio" aria-hidden="true">*</span></legend>
          <div class="segmentos segmentos-texto">
            <input type="radio" name="clase" id="c1" value="herramienta"><label for="c1">Herramienta</label>
            <input type="radio" name="clase" id="c2" value="materiales"><label for="c2">Materiales</label>
            <input type="radio" name="clase" id="c3" value="produccion"><label for="c3">Insumos de producción</label>
          </div>
          <div class="mensaje-error mensaje-suelto" id="clase-error" aria-live="polite"></div>
        </fieldset>
    <div class="campo">
      <label class="form-label" for="proveedor">Proveedor <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="proveedor" maxlength="120" autocomplete="organization" required data-mensaje="Escriba el nombre o la razón social del proveedor." aria-describedby="proveedor-ayuda proveedor-error" placeholder="Ej.: Agroinsumos del Quindío S.A.S.">
      <div class="form-text" id="proveedor-ayuda">Nombre o razón social de donde se compró.</div>
      <div class="mensaje-error" id="proveedor-error" aria-live="polite"></div>
    </div>
    <div class="campo">
      <label class="form-label" for="documento-proveedor">Cédula o NIT <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="documento-proveedor" maxlength="20" autocomplete="off" required data-mensaje="Escriba la cédula o el NIT del proveedor." aria-describedby="documento-proveedor-ayuda documento-proveedor-error" placeholder="Ej.: 900.123.456-7">
      <div class="form-text" id="documento-proveedor-ayuda">Solo números. Si es NIT, puede agregar el dígito de verificación después del guion.</div>
      <div class="mensaje-error" id="documento-proveedor-error" aria-live="polite"></div>
    </div>
      <div class="dos">
    <div class="campo">
      <label class="form-label" for="cantidad-insumo">Cantidad <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="cantidad-insumo" inputmode="decimal" required data-minimo="1" data-mensaje="Escriba la cantidad comprada." aria-describedby="cantidad-insumo-error" placeholder="0">
      <div class="mensaje-error" id="cantidad-insumo-error" aria-live="polite"></div>
    </div>
    <div class="campo">
      <label class="form-label" for="unidad">Unidad <span class="obligatorio" aria-hidden="true">*</span></label>
      <select class="form-select" id="unidad" required data-mensaje="Elija la unidad." aria-describedby="unidad-error"><option value="">Elija</option><option value="kg">Kilogramos</option><option value="g">Gramos</option><option value="l">Litros</option><option value="unidad">Unidades</option></select>
      <div class="mensaje-error" id="unidad-error" aria-live="polite"></div>
    </div>
      </div>
      </div>
    <div class="campo">
      <label class="form-label" for="desc">Descripción <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="desc" required data-mensaje="Describa el gasto, por ejemplo abono para el lote 2." aria-describedby="desc-error" placeholder="Ej.: abono para el lote 2">
      <div class="mensaje-error" id="desc-error" aria-live="polite"></div>
    </div>
    <div class="campo">
      <label class="form-label" for="valor">Valor <span class="obligatorio" aria-hidden="true">*</span></label>
      <div class="input-group"><input class="form-control" id="valor" inputmode="numeric" required data-minimo="1" data-mensaje="Escriba el valor del gasto." aria-describedby="valor-ayuda valor-error" placeholder="0"><span class="input-group-text">COP</span></div>
      <div class="form-text" id="valor-ayuda">Pesos colombianos, sin decimales.</div>
      <div class="mensaje-error" id="valor-error" aria-live="polite"></div>
    </div>
    <div class="campo">
      <label class="form-label" for="fecha-g">Fecha del gasto <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="fecha-g" type="date" value="2026-10-08" required data-mensaje="Escriba la fecha del gasto." aria-describedby="fecha-g-error">
      <div class="mensaje-error" id="fecha-g-error" aria-live="polite"></div>
    </div>
      <button class="btn-primario" type="submit">Guardar</button>
      <a class="btn-secundario" href="panel.html">Cancelar</a>
    </form>
