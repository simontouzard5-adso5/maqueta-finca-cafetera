<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5D3A1A">
  <title>Recuperar contraseña · Finca Cafetera</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="app">
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="barra-app con-volver">
    <a class="boton-icono" href="index.html" aria-label="Volver"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false">  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg></a>
    <h1>Recuperar contraseña</h1>
  </header>
  <main id="contenido" class="contenido">
    <p class="saludo">Escriba su correo y le enviaremos un enlace para crear una contraseña nueva.</p>
    <form class="formulario" data-validar novalidate>
      <div class="aviso aviso-ok" hidden tabindex="-1"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false">  <path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425z"/></svg><span>Enviamos el enlace a su correo. Revise también la carpeta de no deseados.</span></div>
    <div class="campo">
      <label class="form-label" for="correo-rec">Correo electrónico <span class="obligatorio" aria-hidden="true">*</span></label>
      <input class="form-control" id="correo-rec" type="email" required data-mensaje="Escriba su correo para continuar." aria-describedby="correo-rec-error" placeholder="nombre@correo.com">
      <div class="mensaje-error" id="correo-rec-error" aria-live="polite"></div>
    </div>
      <button class="btn-primario" type="submit">Enviar enlace</button>
      <a class="btn-secundario" href="index.html">Volver al inicio de sesión</a>
    </form>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
